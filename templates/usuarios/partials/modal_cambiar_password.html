<div class="p-6 space-y-4">
    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-slate-900 dark:text-amber-400 uppercase tracking-wide">
            🔑 Cambiar Contraseña — {{ usuario.nombre_completo }}
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white font-bold text-sm">✕</button>
    </div>

    <form hx-post="{% url 'panel_usuario_cambiar_password' usuario.id %}" class="space-y-4 text-xs">
        {% csrf_token %}
        
        <div>
            <label class="block font-bold text-slate-400 dark:text-darkTextSub uppercase mb-1">Nueva Contraseña</label>
            <input type="password" name="nueva_password" required minlength="6" placeholder="Ingresa la nueva contraseña"
                   class="w-full p-2.5 border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-darkBg text-slate-900 dark:text-slate-100 outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <div class="bg-amber-50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900/30 p-3 rounded-lg text-amber-800 dark:text-amber-400 text-[11px]">
            📧 Al guardar, se enviará automáticamente un correo electrónico de notificación a: <strong>{{ usuario.correo_electronico|default:"Sin correo asignado" }}</strong>.
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 dark:bg-darkBg text-slate-600 dark:text-slate-300 rounded-lg font-semibold hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                Cancelar
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-600 dark:bg-amber-500 text-white dark:text-slate-950 rounded-lg font-bold hover:bg-blue-500 dark:hover:bg-amber-600 transition">
                🔑 Actualizar Contraseña
            </button>
        </div>
    </form>
</div>
